name: Bug 报告
description: 报告可稳定复现的功能问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 请勿上传真实论文、个人数据库、API Key、许可证或包含个人信息的截图。
  - type: input
    id: version
    attributes:
      label: 版本与系统
      placeholder: 例如 v1.16.0 / Windows 11
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 请按顺序描述操作步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 可提供已脱敏的日志或演示空间截图。
